{% extends 'base.html' %}{% block content %}<h2>Activity history</h2><div class="card p-3 mt-3">{% for log in logs %}<div class="activity-row"><span class="activity-dot"></span><div><strong>{{ log.action }}</strong><div>{{ log.description }}</div><small class="text-muted">{{ log.timestamp }}</small></div></div>{% else %}<p class="text-muted">No activity recorded.</p>{% endfor %}</div>{% endblock %}
