{% extends 'base.html' %}{% block content %}<div class="auth-card card p-4 mx-auto">
<h2>Create account</h2><p class="text-muted">Your private file workspace starts here.</p>
<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" minlength="3" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">Register</button></form></div>{% endblock %}
