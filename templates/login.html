{% extends 'base.html' %}{% block content %}<div class="auth-card card p-4 mx-auto">
<h2>Welcome back</h2><p class="text-muted">Sign in to your workspace.</p>
<form method="post"><label class="form-label">Email or username</label><input class="form-control mb-3" name="identity" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0 small">New here? <a href="{{ url_for('register') }}">Create account</a></p></div>{% endblock %}
