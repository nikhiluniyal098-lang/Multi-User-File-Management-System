{% extends 'base.html' %}{% block content %}<h2>Shared with me</h2><div class="card mt-3"><table class="table mb-0"><tr><th>File</th><th>Permission</th><th>Owner</th></tr>{% for s in shares %}<tr><td><a href="{{ url_for('file_detail',file_id=s.file_id) }}">{{ s.file.original_filename if s.file else 'Unavailable' }}</a></td><td>{{ s.permission_type }}</td><td>{{ s.owner_id }}</td></tr>{% else %}<tr><td colspan="3" class="text-muted">No files have been shared with you.</td></tr>{% endfor %}</table></div>{% endblock %}
